services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USERNAME: ${DEV_USER:-developer}
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
    container_name: vscode-remote-dev
    hostname: dev-container
    ports:
      - "2222:22"  # SSH порт
      - "8000:8000"    # Проброс порта 8000 для тестирования сервиса
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      # Монтируем папку с ключами с хоста в контейнер
      - ./ssh-keys:/home/developer/.ssh
      #- dev-workspace:/workspace
      - ./workspace:/workspace
      - dev-home:/home/developer
      - /var/run/docker.sock:/var/run/docker.sock  # Опционально: Docker-in-Docker
    environment:
      - LANG=ru_RU.UTF-8
      - LC_ALL=ru_RU.UTF-8
      - LANGUAGE=ru_RU:ru
      - OLLAMA_HOST=http://host.docker.internal:11434  # Доступ к Ollama на хосте
      - OLLAMA_API_URL=http://host.docker.internal:11434/api
      # Для тестового сервиса
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - FORGEJO_URL=${FORGEJO_URL:-http://host.docker.internal:3000}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
    restart: unless-stopped
    networks:
      - dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Для доступа к Forgejo на хосте
    command: >
      sh -c "
        [ ! -f /etc/ssh/ssh_host_rsa_key ] && ssh-keygen -t rsa -b 4096 -f /etc/ssh/ssh_host_rsa_key -N '' -q 2>/dev/null;
        [ ! -f /etc/ssh/ssh_host_ecdsa_key ] && ssh-keygen -t ecdsa -b 521 -f /etc/ssh/ssh_host_ecdsa_key -N '' -q 2>/dev/null;
        [ ! -f /etc/ssh/ssh_host_ed25519_key ] && ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key -N '' -q 2>/dev/null;
        /usr/sbin/sshd -D
      "

networks:
  dev-network:
    driver: bridge

volumes:
  dev-workspace:
  dev-home:
